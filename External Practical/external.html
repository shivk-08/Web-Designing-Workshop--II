<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks & Grade Calculator</title>
    <link rel="stylesheet" href="external.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks & Grade Calculator</h1>
        <label for="subjectCount">Number of Subjects:</label>
        <input type="number" id="subjectCount" min="1" placeholder="Enter No. of subjects">

        <button onclick="generateInputs()">Generate Fields</button>

        <div id="marksContainer"></div>

        <button id="calculateBtn" onclick="calculateResult()">
            Calculate Result
        </button>

        <div id="result"></div>
    </div>

    <script src="external.js"></script>

</body>
</html>
